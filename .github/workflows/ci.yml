name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Configure git identity for test repos
        run: |
          git config --global user.email ci@example.com
          git config --global user.name ci
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check src tests
      - name: Types
        run: python -m mypy
      - name: Tests
        run: python -m pytest -q
      - name: CLI smoke test
        run: contextweft doctor
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build
        run: python -m pip install build && python -m build
      - name: Install wheel in clean venv
        run: |
          python -m venv /tmp/v
          /tmp/v/bin/pip install dist/*.whl
          /tmp/v/bin/contextweft --version
          /tmp/v/bin/contextweft doctor
          /tmp/v/bin/python -c "import importlib.resources as r; assert r.files('contextweft').joinpath('SKILL.md').is_file()"
